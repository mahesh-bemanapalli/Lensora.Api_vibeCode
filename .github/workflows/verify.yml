name: Verify API
on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Lensora.Api.csproj --configuration Release
      - run: dotnet build verification/PlatformDesignChecks/PlatformDesignChecks.csproj --configuration Release
      - run: dotnet build verification/MediaLibraryChecks/MediaLibraryChecks.csproj --configuration Release
